spring.application.name=fieldpilot
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fieldpilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
fieldpilot.ml.enabled=${ML_ENABLED:true}
fieldpilot.ml.cron=${ML_CRON:0 0 3 * * *}
fieldpilot.ml.zone=${ML_ZONE:Europe/Moscow}
fieldpilot.ml.source-path=${ML_SOURCE_PATH:./training-data/history.csv}
